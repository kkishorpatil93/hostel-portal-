{% extends "base.html" %}

{% block title %}Reset Password | StayNest PG{% endblock %}

{% block content %}
<section style="padding: 4rem 0;">
  <div class="container" style="max-width: 460px;">
    <div class="card" style="box-shadow: var(--shadow-lg); border: 1px solid var(--border-color);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; background-color: var(--color-primary-light, #eff6ff); color: var(--color-primary); margin-bottom: 1rem;">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; letter-spacing: -0.02em;">Set New Password</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Please enter and confirm your new password below (minimum 8 characters).</p>
      </div>

      <form method="POST" action="{{ url_for('auth.reset_password') }}" id="reset-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="token" value="{{ token }}">

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" for="password" style="font-weight: 600;">New Password</label>
          <div style="position: relative;">
            <input type="password" id="password" name="password" class="form-control" placeholder="At least 8 characters" minlength="8" required autofocus style="padding-right: 2.75rem;">
            <button type="button" onclick="togglePasswordVisibility('password', this)" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.25rem; display: flex; align-items: center;" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="7" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" for="confirm_password" style="font-weight: 600;">Confirm New Password</label>
          <div style="position: relative;">
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="8" required style="padding-right: 2.75rem;">
            <button type="button" onclick="togglePasswordVisibility('confirm_password', this)" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.25rem; display: flex; align-items: center;" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="7" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
          <span id="btn-text">Update Password</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
        <a href="{{ url_for('auth.login') }}" style="color: var(--color-primary); text-decoration: none; font-weight: 500;">&larr; Back to Sign In</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    } else {
      input.type = 'password';
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="7" r="3"/></svg>';
    }
  }

  document.getElementById('reset-form').addEventListener('submit', function(e) {
    var p1 = document.getElementById('password').value;
    var p2 = document.getElementById('confirm_password').value;
    if (p1 !== p2) {
      e.preventDefault();
      alert('Passwords do not match. Please verify.');
      return false;
    }
    var btn = document.getElementById('submit-btn');
    var btnText = document.getElementById('btn-text');
    if (btn && btnText) {
      btn.disabled = true;
      btnText.textContent = 'Updating Password...';
    }
  });
</script>
{% endblock %}
