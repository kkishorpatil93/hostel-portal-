{% extends "base.html" %}

{% block title %}Sign In to StayNest PG{% endblock %}

{% block content %}
<section style="padding: 4rem 0;">
  <div class="container" style="max-width: 450px;">
    <div class="card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.75rem; font-weight: 700; color: var(--color-primary); margin-bottom: 0.5rem;">Welcome Back</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to your PG resident or owner portal.</p>
      </div>

      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2);">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
            <a href="{{ url_for('auth.forgot_password') }}" style="font-size: 0.8rem; color: var(--color-primary); text-decoration: none;">Forgot password?</a>
          </div>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" id="remember" name="remember" style="accent-color: var(--color-primary);">
          <label for="remember" style="font-size: 0.875rem; color: var(--text-muted); cursor: pointer;">Remember this device</label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1rem;">
        Looking for a room? <a href="{{ url_for('auth.register') }}" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">Register as Tenant</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
