{% extends "base.html" %}

{% block title %}Register Tenant Account{% endblock %}

{% block content %}
<section style="padding: 4rem 0;">
  <div class="container" style="max-width: 480px;">
    <div class="card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.75rem; font-weight: 700; color: var(--color-primary); margin-bottom: 0.5rem;">Create Tenant Account</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Register to request room bookings, pay rent, and log complaints.</p>
      </div>

      <form method="POST" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label" for="full_name">Full Legal Name *</label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Arjun Sharma" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address *</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="arjun@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Mobile Number (10 digits) *</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (minimum 8 characters) *</label>
          <input type="password" id="password" name="password" class="form-control" minlength="8" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="8" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Register Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1rem;">
        Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
